[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "referee-ai"
version = "0.1.0"
description = "Evidence-grounded multi-view football referee assistant"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
video = ["torch>=2.4", "transformers>=4.57", "accelerate>=1.1", "qwen-vl-utils>=0.0.14", "av>=12"]
train = ["torch>=2.4", "transformers>=4.57", "accelerate>=1.1", "datasets>=3", "peft>=0.13", "bitsandbytes>=0.44", "trl>=0.12", "wandb>=0.18"]
serve = ["vllm>=0.11"]
rag = ["sentence-transformers>=3", "faiss-cpu>=1.8", "rank-bm25>=0.2.2"]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
